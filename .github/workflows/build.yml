name: Build e Release do APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar chave de assinatura
        env:
          KS_B64: ${{ secrets.KUGO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KUGO_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KUGO_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KUGO_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            echo "Usando keystore dos GitHub Secrets."
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kugo.jks"
            echo "KUGO_KEYSTORE=$RUNNER_TEMP/kugo.jks" >> "$GITHUB_ENV"
            echo "KUGO_STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KUGO_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KUGO_KEY_PASSWORD=$KS_KEYPASS" >> "$GITHUB_ENV"
          else
            echo "Sem secrets: gerando chave de debug temporária (APK instalável, mas a assinatura muda a cada build)."
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar APK Release
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK" || { echo "APK não foi gerado"; exit 1; }
          unzip -l "$APK" | grep -E "AndroidManifest.xml|classes.dex"
          ls -lh "$APK"

      - name: Renomear APK
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Kugo-Auto-Clicker-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Kugo-Auto-Clicker-v${{ steps.meta.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publicar em GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A Release $TAG já existe e NÃO será substituída. Aumente versionName em app/build.gradle.kts para publicar uma nova versão."
            exit 0
          fi
          gh release create "$TAG" "dist/Kugo-Auto-Clicker-${TAG}.apk" \
            --title "KUGO AUTO CLICKER ${TAG}" \
            --target "$GITHUB_SHA" \
            --notes "KUGO AUTO CLICKER ${TAG}
          
          - Data da compilação: $(date -u +%Y-%m-%d)
          - Commit: ${GITHUB_SHA::7}
          - Android 7.0+ (API 24). Leitura do mouse requer root no emulador.
          - Instale o APK, ative a acessibilidade do KUGO e toque em INICIAR."

      - name: Resumo
        run: |
          echo "### APK compilado" >> "$GITHUB_STEP_SUMMARY"
          echo "Versão: ${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
